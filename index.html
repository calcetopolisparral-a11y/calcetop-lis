*{box-sizing:border-box}

html{scroll-behavior:smooth}

justify-content:space-between;

.brand{

}

.kicker{

}

.hero p{
font-size:18px;

}

.btn{

}

.hero-card{

}

.hero-card img{

display:block;

}

.section{

}

.title{
text-align:center;
margin-bottom:28px
}

.title h2{
font-size:34px;
margin:0 0 8px
}

.districts{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:18px
}
